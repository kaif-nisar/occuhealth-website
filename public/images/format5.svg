  <rect x="15" y="105" width="44" height="3" rx="1" fill="#1e3a5f"/>
  <rect x="78" y="105" width="20" height="3" rx="1" fill="#1e3a5f"/>
  <rect x="108" y="105" width="16" height="3" rx="1" fill="#1e3a5f"/>
