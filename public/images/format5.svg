  <rect x="12" y="28" width="52" height="2.5" rx="1" fill="#cbd5e1"/>
  <!-- NABL badge placeholder top-right -->
  <circle cx="159" cy="18" r="8" fill="#f1f5f9" stroke="#1e3a5f" stroke-width="1"/>
  <text x="159" y="20.5" font-family="Arial, sans-serif" font-size="5" font-weight="700" text-anchor="middle" fill="#1e3a5f">NABL</text>

  <!-- Patient & Specimen Card -->
  <rect x="12" y="37" width="156" height="44" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
