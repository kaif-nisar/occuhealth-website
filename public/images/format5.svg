  <rect x="18" y="178" width="42" height="2.5" rx="1" fill="#0f766e"/>
  <rect x="18" y="183" width="140" height="2" rx="1" fill="#64748b"/>
  <rect x="18" y="188" width="112" height="2" rx="1" fill="#94a3b8"/>

