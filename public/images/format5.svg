  <!-- Right column specimen & barcode -->
  <g fill="#0f172a">
    <rect x="102" y="44" width="1.5" height="9"/>
    <rect x="105" y="44" width="2.5" height="9"/>
    <rect x="109" y="44" width="1" height="9"/>
    <rect x="111.5" y="44" width="2" height="9"/>
    <rect x="115" y="44" width="1" height="9"/>
    <rect x="117.5" y="44" width="2.5" height="9"/>
    <rect x="121.5" y="44" width="1.5" height="9"/>
    <rect x="124.5" y="44" width="1" height="9"/>
    <rect x="127" y="44" width="2" height="9"/>
    <rect x="130.5" y="44" width="1.5" height="9"/>
  </g>
  <rect x="102" y="57" width="56" height="2.5" rx="1" fill="#475569"/>
  <rect x="102" y="63" width="52" height="2.5" rx="1" fill="#64748b"/>
  <rect x="102" y="69" width="58" height="2.5" rx="1" fill="#64748b"/>

