  <rect x="14" y="210" width="24" height="24" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
  <rect x="17" y="213" width="7" height="7" fill="#1e3a5f"/>
  <rect x="28" y="213" width="7" height="7" fill="#1e3a5f"/>
  <rect x="17" y="224" width="7" height="7" fill="#1e3a5f"/>
  <rect x="28" y="224" width="4" height="4" fill="#0f766e"/>

  <line x1="56" y1="224" x2="88" y2="224" stroke="#94a3b8" stroke-width="0.7"/>
  <rect x="58" y="226" width="28" height="2.5" rx="1" fill="#0f172a"/>
  <rect x="61" y="230" width="22" height="2" rx="1" fill="#64748b"/>

  <line x1="100" y1="224" x2="132" y2="224" stroke="#94a3b8" stroke-width="0.7"/>
  <rect x="102" y="226" width="28" height="2.5" rx="1" fill="#0f172a"/>
  <rect x="105" y="230" width="22" height="2" rx="1" fill="#64748b"/>

  <line x1="140" y1="224" x2="168" y2="224" stroke="#94a3b8" stroke-width="0.7"/>
  <rect x="141" y="226" width="26" height="2.5" rx="1" fill="#0f172a"/>
  <rect x="144" y="230" width="20" height="2" rx="1" fill="#64748b"/>
</svg>
