  <rect x="15" y="146.5" width="52" height="3" rx="1" fill="#0f766e"/>
  <line x1="18" y1="154" x2="18" y2="168" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="22" y="156" width="38" height="2.5" rx="1" fill="#334155"/>
  <rect x="79" y="156" width="16" height="2.5" rx="1" fill="#0f172a"/>
  <rect x="108" y="156" width="14" height="2" rx="1" fill="#64748b"/>
  <rect x="134" y="156" width="26" height="2" rx="1" fill="#64748b"/>
  <rect x="22" y="163" width="34" height="2.5" rx="1" fill="#334155"/>
  <rect x="79" y="163" width="14" height="2.5" rx="1" fill="#0f172a"/>
  <rect x="108" y="163" width="14" height="2" rx="1" fill="#64748b"/>
  <rect x="134" y="163" width="26" height="2" rx="1" fill="#64748b"/>

