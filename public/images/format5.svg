  <rect x="108" y="132" width="14" height="2.5" rx="1" fill="#64748b"/>
  <rect x="134" y="132" width="28" height="2.5" rx="1" fill="#64748b"/>
  <line x1="12" y1="142" x2="168" y2="142" stroke="#f1f5f9" stroke-width="0.8"/>

