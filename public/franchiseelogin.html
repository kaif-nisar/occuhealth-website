<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="images/fevicon.jpg" />
    <title>OCCU Health Franchisee Login</title>
    <meta name="description"
        content="Login page for OCCU Health franchisees to access their dashboard and manage bookings.">

    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        body {
            font-family: Georgia, 'Times New Roman', Times, serif;
            background-image: url(high-angle-science-elements-composition.jpg);
            background-size: cover;
            background-color: #f5f5f5;
            background-repeat: no-repeat;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            display: flex;
            align-items: center;
            background: white;
            border-radius: 15px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.2);
            overflow: hidden;
            width: 800px;
            margin-left: 200px;
        }

        .lottie-container {
            width: 50%;
            height: 100%;
        }

        .form-container {
            padding: 40px;
            width: 50%;
            position: relative;
        }

        h2 {
            margin-bottom: 20px;
            color: #333;
            text-align: center;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            color: #aaa;
            font-size: 14px;
            margin-bottom: 5px;
            transition: color 0.2s;
        }

        .input-group input {
            width: 100%;
            padding: 10px 12px;
            border: 2px solid #0072ff;
            border-radius: 5px;
            transition: border-color 0.3s;
            font-size: 14px;
            font-family: inherit;
        }

        .input-group input:focus {
            border-color: #00c6ff;
            outline: none;
        }

        /* Password wrapper */
        .password-wrapper {
            position: relative;
        }

        .password-wrapper input {
            padding-right: 42px;
        }

        .password-toggle {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            color: #6b7280;
            font-size: 1.1rem;
            padding: 6px;
            line-height: 1;
            transition: color 0.2s ease;
            z-index: 2;
        }

        .password-toggle:hover {
            color: #0072ff;
        }

        button[type="submit"] {
            width: 100%;
            padding: 10px;
            background: #0072ff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s;
            font-size: 16px;
            margin: 5px 0px;
        }

        button[type="submit"]:hover {
            background: #00c6ff;
        }

        .error {
            color: red;
            margin-top: 10px;
            text-align: center;
        }

        #role {
            width: 100%;
            padding: 10px 12px;
            border: 2px solid #0072ff;
            border-radius: 5px;
            transition: border-color 0.3s;
            margin-bottom: 20px;
            font-family: inherit;
        }

        @media(max-width: 768px) {
            .lottie-container {
                display: none;
            }

            body {
                display: flex;
                align-items: center;
                justify-content: center;
            }

            .form-container {
                display: inline;
                align-items: center;
                justify-content: center;
                position: absolute;
                right: 50px;
            }
        }

        /* Modal styles */
        #forgotPasswordModal {
            display: none;
            position: fixed;
            z-index: 1;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0, 0, 0, 0.4);
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background-color: #fefefe;
            margin: 15% auto;
            padding: 20px;
            border: 1px solid #888;
            border-radius: 8px;
            width: 320px;
            text-align: center;
            position: relative;
        }

        .modal-close {
            position: absolute;
            top: 12px;
            right: 14px;
            color: #999;
            font-size: 1.2rem;
            cursor: pointer;
            background: none;
            border: none;
            padding: 4px;
            line-height: 1;
            transition: color 0.2s ease;
        }

        .modal-close:hover {
            color: #333;
        }

        .modal-content h2 {
            margin-top: 0;
            margin-bottom: 16px;
        }

        .modal-content input[type="email"] {
            width: 100%;
            padding: 10px 12px;
            border: 2px solid #0072ff;
            border-radius: 5px;
            margin-bottom: 12px;
            font-family: inherit;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        .modal-content input[type="email"]:focus {
            border-color: #00c6ff;
            outline: none;
        }

        .modal-content button {
            width: 100%;
            padding: 10px;
            background: #0072ff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.3s;
        }

        .modal-content button:hover {
            background: #00c6ff;
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            color: #555;
        }

        .remember-me input {
            width: auto;
            margin: 0;
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
        integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bodymovin/5.7.6/lottie.min.js"></script>
</head>

<body>
    <div class="container">
        <div class="lottie-container" id="lottie"></div>
        <div class="form-container">
            <h2>OccuHealth Login</h2>
            <form id="loginForm">
                <div class="input-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" required>
                </div>
                <div class="input-group">
                    <label for="password">Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="password" name="password" required>
                        <button type="button" class="password-toggle" id="togglePassword"
                            aria-label="Toggle password visibility">
                            <i class="fa-solid fa-eye"></i>
                        </button>
                    </div>
                </div>
                <div class="remember-me">
                    <input type="checkbox" id="rememberMe" name="rememberMe">
                    <label for="rememberMe">Remember Me</label>
                </div>
                <button type="submit" id="loginBtn">Login</button>
                <div class="error" id="errorMessage" style="transition: all 0.3s ease;"></div>
            </form>
            <p style="text-align:center;"><a href="#" id="forgotPasswordLink">Forgot Password?</a></p>
        </div>
    </div>

    <!-- Modal for Forgot Password -->
    <div id="forgotPasswordModal">
        <div class="modal-content">
            <button class="modal-close" aria-label="Close modal">
                <i class="fa-solid fa-xmark"></i>
            </button>
            <h2>Reset Password</h2>
            <input type="email" id="resetEmail" placeholder="Enter your email" required>
            <button id="resetPasswordButton">Send Reset Link</button>
            <div class="error" id="resetErrorMessage"></div>
        </div>
    </div>

    <script>
        // Load Lottie animation
        const animation = lottie.loadAnimation({
            container: document.getElementById('lottie'),
            renderer: 'svg',
            loop: true,
            autoplay: true,
            path: 'Animation - 1731414043375.json'
        });

        // Initialize Remember Me
        document.addEventListener("DOMContentLoaded", () => {
            const savedUser = localStorage.getItem('rememberedUsername');
            if (savedUser) {
                document.getElementById('username').value = savedUser;
                document.getElementById('rememberMe').checked = true;
            }
        });

        // Password Toggle
        document.getElementById('togglePassword').addEventListener('click', function () {
            const passwordInput = document.getElementById('password');
            const eyeIcon = this.querySelector('i');
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            if (type === 'password') {
                eyeIcon.className = 'fa-solid fa-eye';
            } else {
                eyeIcon.className = 'fa-solid fa-eye-slash';
            }
        });

        async function verifyAccessToken() {
            try {
                const response = await fetch('/api/verify-token', {
                    method: 'GET',
                    credentials: 'include'
                });
                if (!response.ok) throw new Error('Unauthorized access');
                const data = await response.json();
                return data.isAuthorized;
            } catch (error) {
                console.error('Access Token Verification Failed:', error);
                return false;
            }
        }

        const BASE_URL = window.location.origin;

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            const rememberMe = document.getElementById('rememberMe').checked;
            let email = username;

            const errorDiv = document.getElementById('errorMessage');
            const loginBtn = document.getElementById('loginBtn');
            errorDiv.innerText = '';

            if (!username || !password) {
                errorDiv.innerText = "Please enter both email and password.";
                return;
            }

            loginBtn.disabled = true;
            loginBtn.innerText = "Logging in...";

            try {
                const response = await fetch(`${BASE_URL}/api/v1/user/login-admin`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({ email, username, password }),
                });

                const data = await response.json();

                if (response.status === 403) {
                    errorDiv.innerText = "Your account is inactive. Please contact support.";
                    return;
                }
                if (response.status === 401) {
                    errorDiv.innerText = "Incorrect password. Please try again.";
                    return;
                }
                if (response.status === 404) {
                    errorDiv.innerText = "User not found. Please check your email.";
                    return;
                }
                if (!response.ok) {
                    errorDiv.innerText = data.message || "Login failed. Please try again.";
                    return;
                }

                if (data.success) {
                    console.log('Login successful');

                    if (rememberMe) {
                        localStorage.setItem('rememberedUsername', username);
                    } else {
                        localStorage.removeItem('rememberedUsername');
                    }

                    const isAuthorized = await verifyAccessToken();
                    if (!isAuthorized) {
                        errorDiv.innerText = 'You are not authorized to access this page.';
                        return;
                    }

                    if (data.userData.myrole === 'staff') {
                        data.userData.myrole = data.userData.role;
                    }

                    const roleRedirects = {
                        'admin': 'admin/admin.html',
                        'superFranchisee': 'superFranchisee/superFranchisee.html',
                        'franchisee': 'franchisee/franchisee.html',
                        'subFranchisee': 'subFranchisee/subFranchisee.html'
                    };

                    if (roleRedirects[data.userData.myrole]) {
                        window.location.href = `${BASE_URL}/${roleRedirects[data.userData.myrole]}`;
                    } else {
                        console.error('Unknown role:', data.userData.myrole);
                    }
                }
            } catch (error) {
                console.error('Error during login:', error);
                errorDiv.innerText = "Something went wrong. Please try again later.";
            } finally {
                loginBtn.disabled = false;
                loginBtn.innerText = "Login";
            }
        });

        // Forgot Password
        document.getElementById('forgotPasswordLink').addEventListener('click', function () {
            document.getElementById('forgotPasswordModal').style.display = 'flex';
        });

        document.querySelector('.modal-close').addEventListener('click', function () {
            document.getElementById('forgotPasswordModal').style.display = 'none';
        });

        document.getElementById('resetPasswordButton').addEventListener('click', async function (e) {
            const email = document.getElementById('resetEmail').value.trim();
            if (!email) {
                document.getElementById('resetErrorMessage').innerText = "Please enter your email.";
                return;
            }

            e.target.disabled = true;
            e.target.textContent = "Sending...";

            try {
                const response = await fetch(`${BASE_URL}/api/v1/user/forgotPassword`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email }),
                });

                const data = await response.json();

                if (response.ok) {
                    alert("Password reset link sent to your email.");
                    document.getElementById('forgotPasswordModal').style.display = 'none';
                } else {
                    document.getElementById('resetErrorMessage').innerText = data.message || "Failed to send reset link.";
                }
            } catch (error) {
                console.error('Error during password reset:', error);
                document.getElementById('resetErrorMessage').innerText = "Something went wrong. Please try again later.";
            } finally {
                e.target.disabled = false;
                e.target.textContent = "Send Reset Link";
            }
        });
    </script>
</body>

</html>
