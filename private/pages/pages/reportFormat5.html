<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Diagnostic Report — Format 5 (Executive Clinical)</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
</head>

<body>
    <!-- =========================================================================
         REPORT FORMAT 5 — EXECUTIVE CLINICAL DIAGNOSTIC REPORT (v3 REFINED)
         File: private/pages/pages/reportFormat5.html
         Highlights:
         - Soft clinical slate hairline borders (no heavy harsh dark lines)
         - Ultra-compact, evenly distributed Row Spacing (0.5px padding at Spacing = 1)
         - Category & Test Profile banners positioned ABOVE tables (never inside tbody)
         - Horizontally centered Observed Result ([spacer | centered value | flag rail])
           AND horizontally centered Biological Ref. Interval & Unit columns
         - Compact Header with right-column Timestamps + always-visible Investigations
           and per-specimen/per-page authentic Specimen Barcode
         ========================================================================= -->
    <style id="oh5OverlayStyles">
        .oh5-modal {
            position: fixed;
            inset: 0;
            z-index: 250000 !important;
            background: rgba(15, 23, 42, 0.68);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 16px;
            box-sizing: border-box;
            font-family: 'Inter', 'Segoe UI', Arial, Helvetica, sans-serif;
        }

        .oh5-modal * {
            box-sizing: border-box;
        }

        .oh5-modal-card {
            width: 100%;
            max-width: 880px;
            height: min(88vh, 840px);
            background: #ffffff;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 24px 60px rgba(15, 23, 42, 0.38);
            border: 1px solid #cbd5e1;
        }

        .oh5-modal-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            background: #f8fafc;
            border-bottom: 1px solid #e2e8f0;
            gap: 10px;
            flex-wrap: wrap;
        }

        .oh5-share-tabs {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .oh5-share-tabs button {
            border: 1px solid #cbd5e1;
            background: #ffffff;
            color: #0f172a;
            padding: 7px 13px;
            border-radius: 8px;
            font-size: 12.5px;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.15s ease;
        }

        .oh5-share-tabs button:hover {
            border-color: #1e3a5f;
            color: #1e3a5f;
            background: #f1f5f9;
        }

        .oh5-close-modal {
            background: transparent;
            border: none;
            font-size: 24px;
            line-height: 1;
            cursor: pointer;
            color: #64748b;
            padding: 2px 8px;
            border-radius: 6px;
        }

        .oh5-close-modal:hover {
            background: #e2e8f0;
            color: #0f172a;
        }

        .oh5-contact-bar {
            display: none;
            padding: 10px 16px;
            background: #f1f5f9;
            border-bottom: 1px solid #cbd5e1;
            gap: 8px;
            align-items: center;
        }

        .oh5-contact-bar input {
            flex: 1;
            padding: 8px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 13px;
            background: #ffffff;
        }

        .oh5-contact-bar button {
            padding: 8px 16px;
            border-radius: 8px;
            border: none;
            background: #1e3a5f;
            color: #ffffff;
            font-weight: 600;
            cursor: pointer;
        }

        .oh5-pdf-frame {
            flex: 1;
            width: 100%;
            border: none;
            background: #e2e8f0;
        }

        .oh5-toast-stack {
            position: fixed;
            top: 68px;
            right: 20px;
            z-index: 260000 !important;
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-width: 340px;
            pointer-events: none;
            font-family: 'Inter', 'Segoe UI', Arial, Helvetica, sans-serif;
        }

        .oh5-toast {
            pointer-events: auto;
            background: #0f172a;
            color: #ffffff;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 12.5px;
            font-weight: 500;
            box-shadow: 0 8px 24px rgba(15, 23, 42, 0.28);
            border-left: 4px solid #3b82f6;
        }

        .oh5-toast.is-success { border-left-color: #10b981; }
        .oh5-toast.is-error { border-left-color: #ef4444; }
        .oh5-toast.is-warn { border-left-color: #f59e0b; }
    </style>

    <div id="oh5PageRoot" class="oh5-page-root">
        <style id="oh5Styles">
            @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

            :root {
                --oh5-navy: #1e3a5f;
                --oh5-accent: #2b4c7e;
                --oh5-teal: #0f766e;
                --oh5-ink: #0f172a;
                --oh5-slate: #475569;
                --oh5-muted: #64748b;
                --oh5-border: #d5dde7;
                --oh5-border-soft: #e6ecf2;
                --oh5-row-rule: #eef2f6;
                --oh5-bg-soft: #f9fbfd;
                --oh5-bg-band: #f3f6fa;
                --oh5-danger: #b91c1c;
                --oh5-danger-bg: #fef2f2;
                --oh5-danger-border: #fca5a5;
                --oh5-canvas-bg: #e2e8f0;
            }

            .oh5-page-root {
                font-family: 'Inter', 'Segoe UI', Arial, Helvetica, sans-serif;
                color: var(--oh5-ink);
                background: var(--oh5-canvas-bg);
                min-height: 100vh;
                padding-bottom: 56px;
                box-sizing: border-box;
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }

            .oh5-page-root *,
            .oh5-page-root *::before,
            .oh5-page-root *::after {
                box-sizing: border-box;
            }

            /* ================= COMPACT TOP CONTEXT BAR ================= */
            .oh5-topbar {
                position: sticky;
                top: var(--topbar-height, 0px);
                z-index: 40;
                background: rgba(255, 255, 255, 0.96);
                backdrop-filter: blur(10px);
                -webkit-backdrop-filter: blur(10px);
                border-bottom: 1px solid #cbd5e1;
                padding: 5px 14px;
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 8px;
                flex-wrap: nowrap;
                box-shadow: 0 2px 8px rgba(15, 23, 42, 0.05);
            }

            .oh5-topbar-left {
                display: flex;
                align-items: center;
                gap: 8px;
                min-width: 0;
                flex: 1 1 auto;
            }

            .oh5-format-chip {
                display: inline-flex;
                align-items: center;
                gap: 5px;
                height: 25px;
                padding: 0 9px;
                border-radius: 999px;
                background: var(--oh5-navy);
                color: #ffffff;
                font-size: 10.5px;
                font-weight: 700;
                letter-spacing: 0.04em;
                text-transform: uppercase;
                white-space: nowrap;
                flex-shrink: 0;
            }

            .oh5-patient-summary {
                font-size: 12px;
                font-weight: 600;
                color: var(--oh5-ink);
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
                min-width: 0;
            }

            .oh5-patient-summary span {
                color: var(--oh5-muted);
                font-weight: 500;
                margin-left: 6px;
                font-size: 11px;
            }

            .oh5-topbar-right {
                display: flex;
                align-items: center;
                gap: 6px;
                flex-shrink: 0;
            }

            .oh5-status-pill {
                display: inline-flex;
                align-items: center;
                gap: 4px;
                height: 25px;
                padding: 0 9px;
                border-radius: 999px;
                font-size: 11px;
                font-weight: 600;
                border: 1px solid #cbd5e1;
                background: #f8fafc;
                color: #334155;
                white-space: nowrap;
            }

            .oh5-status-pill.is-signed {
                background: #ecfdf5;
                border-color: #a7f3d0;
                color: #065f46;
            }

            .oh5-status-pill.is-pending {
                background: #fffbeb;
                border-color: #fde68a;
                color: #92400e;
            }

            .oh5-rowgap-control {
                display: inline-flex;
                align-items: center;
                gap: 5px;
                height: 25px;
                padding: 0 8px;
                margin: 0;
                border-radius: 999px;
                border: 1px solid #cbd5e1;
                background: #ffffff;
                font-size: 11px;
                font-weight: 600;
                color: var(--oh5-navy);
                white-space: nowrap;
            }

            .oh5-rowgap-control input[type="range"] {
                width: 54px;
                margin: 0;
                accent-color: var(--oh5-navy);
                cursor: pointer;
            }

            .oh5-rowgap-val {
                min-width: 14px;
                text-align: center;
                font-weight: 700;
                color: var(--oh5-teal);
                font-variant-numeric: tabular-nums;
            }

            .oh5-letterhead-toggle {
                display: inline-flex;
                align-items: center;
                gap: 5px;
                height: 25px;
                padding: 0 9px;
                margin: 0;
                border-radius: 999px;
                border: 1px solid #cbd5e1;
                background: #ffffff;
                cursor: pointer;
                font-size: 11px;
                font-weight: 600;
                color: var(--oh5-navy);
                user-select: none;
                white-space: nowrap;
                transition: all 0.15s ease;
            }

            .oh5-letterhead-toggle:hover {
                border-color: var(--oh5-navy);
                background: #f8fafc;
            }

            .oh5-letterhead-toggle input {
                margin: 0;
                accent-color: var(--oh5-navy);
                cursor: pointer;
            }

            @media (max-width: 960px) {
                .oh5-topbar {
                    flex-wrap: wrap;
                    padding: 5px 10px;
                    gap: 5px;
                }
                .oh5-topbar-right {
                    flex-wrap: wrap;
                }
            }

            /* ================= SKELETON LOADER ================= */
            .oh5-skeleton-wrap {
                max-width: 794px;
                margin: 24px auto;
                background: #ffffff;
                border-radius: 8px;
                padding: 36px 32px;
                box-shadow: 0 8px 30px rgba(15, 23, 42, 0.12);
            }

            .oh5-skel-line {
                height: 14px;
                border-radius: 6px;
                background: linear-gradient(90deg, #f1f5f9 25%, #e2e8f0 50%, #f1f5f9 75%);
                background-size: 200% 100%;
                animation: oh5Shimmer 1.3s infinite linear;
                margin-bottom: 12px;
            }

            .oh5-skel-card {
                height: 112px;
                border-radius: 6px;
                margin-bottom: 22px;
            }

            @keyframes oh5Shimmer {
                0% { background-position: 200% 0; }
                100% { background-position: -200% 0; }
            }

            /* ================= A4 SHEET VIEWPORT ================= */
            .oh5-viewport {
                width: 100%;
                padding: 12px 10px 22px;
                display: flex;
                flex-direction: column;
                align-items: center;
            }

            .oh5-sheet-stack {
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 16px;
                width: 100%;
            }

            /* True A4 proportions: 794px × 1123px at 96 DPI */
            .oh5-sheet {
                width: 794px;
                min-height: 1123px;
                height: 1123px;
                background-color: #ffffff;
                background-size: 100% 100%;
                background-repeat: no-repeat;
                background-position: center top;
                box-shadow: 0 10px 34px rgba(15, 23, 42, 0.15);
                border-radius: 4px;
                position: relative;
                display: flex;
                flex-direction: column;
                overflow: hidden;
            }

            .oh5-sheet-header {
                flex-shrink: 0;
                width: 100%;
            }

            .oh5-sheet-body {
                flex: 1 1 auto;
                min-height: 0;
                width: 100%;
                overflow: hidden;
            }

            .oh5-sheet-footer {
                flex-shrink: 0;
                width: 100%;
                margin-top: auto;
            }

            /* ================= HEADER CARD (SOFT EXECUTIVE BORDERS & BALANCED GRID) ================= */
            .oh5-header-card {
                width: 100%;
                border: 1px solid var(--oh5-border);
                border-top: 2px solid var(--oh5-accent);
                border-radius: 4px;
                background-color: var(--oh5-bg-soft);
                padding: 6px 10px;
            }

            /* Top Row: Patient Name + Age/Gender + UHID on Left | Specimen Barcode on Right */
            .oh5-header-top-band {
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 10px;
                padding-bottom: 4.5px;
                margin-bottom: 4.5px;
                border-bottom: 1px solid var(--oh5-border-soft);
            }

            .oh5-patient-identity {
                display: flex;
                align-items: center;
                gap: 7px;
                flex-wrap: wrap;
                min-width: 0;
            }

            .oh5-patient-name {
                font-size: 12.5px;
                font-weight: 700;
                color: var(--oh5-ink);
                letter-spacing: 0.01em;
                text-transform: uppercase;
            }

            .oh5-age-gender {
                font-size: 9.5px;
                font-weight: 600;
                color: var(--oh5-accent);
                background: #e8eef5;
                padding: 1px 7px;
                border-radius: 999px;
                white-space: nowrap;
            }

            .oh5-uhid-pill {
                font-size: 9px;
                font-weight: 600;
                color: var(--oh5-slate);
                background: #ffffff;
                border: 1px solid var(--oh5-border);
                padding: 1px 6px;
                border-radius: 3px;
                white-space: nowrap;
            }

            .oh5-barcode-box {
                display: flex;
                align-items: center;
                gap: 8px;
                flex-shrink: 0;
            }

            .oh5-barcode-img-slot img,
            #barcodeImage {
                max-height: 26px;
                max-width: 155px;
                width: auto;
                height: auto;
                display: block;
            }

            .oh5-accession-badge {
                text-align: right;
                line-height: 1.15;
            }

            .oh5-accession-label {
                display: block;
                font-size: 7.2px;
                text-transform: uppercase;
                letter-spacing: 0.05em;
                color: var(--oh5-muted);
                font-weight: 600;
            }

            .oh5-accession-id {
                display: block;
                font-size: 10px;
                font-weight: 700;
                color: var(--oh5-navy);
                font-variant-numeric: tabular-nums;
            }

            /* Balanced Two-Column Metadata Grid (Equal visual density Left & Right) */
            .oh5-header-grid {
                display: grid;
                grid-template-columns: 0.96fr 1.04fr;
                gap: 0 12px;
                align-items: stretch;
            }

            .oh5-patient-col {
                padding-right: 10px;
                border-right: 1px solid var(--oh5-border-soft);
                display: flex;
                flex-direction: column;
                justify-content: flex-start;
            }

            .oh5-specimen-col {
                display: flex;
                flex-direction: column;
                justify-content: flex-start;
                gap: 3px;
            }

            .oh5-meta-table {
                width: 100%;
                border-collapse: collapse;
            }

            .oh5-meta-table td {
                padding: 1px 2px;
                vertical-align: top;
                font-size: 9.2px;
                line-height: 1.24;
            }

            .oh5-meta-label {
                width: 72px;
                font-weight: 600;
                color: var(--oh5-slate);
                white-space: nowrap;
            }

            .oh5-meta-sep {
                width: 7px;
                color: var(--oh5-muted);
                text-align: center;
            }

            .oh5-meta-val {
                color: var(--oh5-ink);
                font-weight: 500;
                word-break: break-word;
            }

            /* Compact 2x2 Specimen Timestamps in Right Column */
            .oh5-ts-grid {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 2px 10px;
                padding-bottom: 3px;
                border-bottom: 1px dashed var(--oh5-border);
            }

            .oh5-ts-item {
                font-size: 8.8px;
                line-height: 1.22;
                color: var(--oh5-ink);
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }

            .oh5-ts-lbl {
                font-weight: 600;
                color: var(--oh5-slate);
                margin-right: 3px;
            }

            /* Investigations right inside Right Column space below timestamps (or full-width bar when many items) */
            .oh5-header-invest {
                display: flex;
                align-items: baseline;
                gap: 5px;
                font-size: 9px;
                line-height: 1.25;
                padding-top: 1px;
                flex-wrap: wrap;
            }

            .oh5-header-invest--full {
                margin-top: 4.5px;
                padding-top: 4px;
                border-top: 1px dashed var(--oh5-border);
                width: 100%;
            }

            .oh5-invest-label {
                font-weight: 700;
                color: var(--oh5-teal);
                text-transform: uppercase;
                letter-spacing: 0.03em;
                white-space: nowrap;
                flex-shrink: 0;
            }

            .oh5-invest-value {
                color: var(--oh5-ink);
                font-weight: 600;
                word-break: break-word;
                overflow-wrap: anywhere;
                flex: 1 1 auto;
            }

            /* ================= CATEGORY & TEST HEADINGS (ABOVE TABLE, SOFT BORDERS) ================= */
            .oh5-category-section {
                margin-bottom: 7px;
            }

            .oh5-category-banner {
                display: flex;
                align-items: center;
                justify-content: center;
                text-align: center;
                background: var(--oh5-bg-band);
                border-top: 1px solid #cbd5e1;
                border-bottom: 1px solid #cbd5e1;
                padding: 3.5px 10px;
                margin: 5px 0 4px 0;
                font-size: 11.5px;
                font-weight: 700;
                color: var(--oh5-navy);
                text-transform: uppercase;
                letter-spacing: 0.07em;
            }

            .oh5-category-section:first-child .oh5-category-banner {
                margin-top: 0;
            }

            /* Profile / Panel Subheading sits cleanly ABOVE table (never inside tbody) */
            .oh5-profile-banner {
                display: flex;
                align-items: center;
                justify-content: center;
                text-align: center;
                background: #fafcfe;
                border-top: 1px solid var(--oh5-border-soft);
                border-bottom: 1px solid var(--oh5-border);
                color: var(--oh5-teal);
                font-size: 10.5px;
                font-weight: 700;
                letter-spacing: 0.05em;
                text-transform: uppercase;
                padding: 3px 10px;
                margin: 4px 0 0 0;
            }

            /* ================= RESULTS TABLE & EVEN ULTRA-COMPACT SPACING ================= */
            .oh5-results-table {
                width: 100%;
                border-collapse: separate;
                border-spacing: 0;
                table-layout: fixed;
                margin: 0 0 5px 0;
                background: transparent;
            }

            .oh5-results-table thead th:nth-child(1) { width: 40%; text-align: left; }
            .oh5-results-table thead th:nth-child(2) { width: 21%; text-align: center; }
            .oh5-results-table thead th:nth-child(3) { width: 14%; text-align: center; }
            .oh5-results-table thead th:nth-child(4) { width: 25%; text-align: center; }

            .oh5-results-table thead th {
                background: var(--oh5-bg-soft);
                border-top: 1px solid var(--oh5-border);
                border-bottom: 1px solid #94a3b8;
                color: var(--oh5-navy);
                font-size: 9px;
                font-weight: 700;
                text-transform: uppercase;
                letter-spacing: 0.05em;
                padding: 4px 8px;
                vertical-align: middle;
            }

            .oh5-results-table tbody td {
                padding: 0.5px 8px;
                font-size: 10.5px;
                line-height: 1.18;
                vertical-align: middle;
                color: var(--oh5-ink);
                border-bottom: 1px solid var(--oh5-row-rule);
                word-wrap: break-word;
                overflow-wrap: break-word;
                font-variant-numeric: tabular-nums;
            }

            .oh5-param-row td:first-child {
                padding-left: 16px;
            }

            .oh5-param-indent {
                display: inline-block;
                border-left: 1.5px solid var(--oh5-border);
                padding-left: 7px;
            }

            .oh5-test-title {
                font-weight: 600;
                color: var(--oh5-ink);
            }

            .oh5-param-row .oh5-test-title {
                font-weight: 500;
                color: #1e293b;
            }

            .oh5-method-note {
                display: block;
                margin-top: 0.5px;
                font-size: 8.4px;
                color: var(--oh5-muted);
                font-style: italic;
                font-weight: 400;
                line-height: 1.12;
            }

            .oh5-col-result-cell {
                text-align: center !important;
            }

            .oh5-unit-cell {
                text-align: center !important;
                color: var(--oh5-slate);
            }

            .oh5-ref-block {
                text-align: center !important;
                color: #334155;
            }

            .oh5-ref-text {
                display: block;
                width: 100%;
                text-align: center !important;
                white-space: pre-line;
                line-height: 1.2;
            }

            /* Symmetric 3-track grid inside Observed Result:
               [22px left balance] [54px+ centered result] [22px H/L rail]
               Centers values mathematically under "OBSERVED RESULT" AND keeps H/L flags
               on a dead-straight vertical line down the table. */
            .oh5-result-wrap {
                display: inline-grid;
                grid-template-columns: 22px minmax(54px, auto) 22px;
                align-items: center;
                justify-content: center;
                column-gap: 4px;
                margin: 0 auto;
                max-width: 100%;
            }

            .oh5-result-spacer {
                width: 22px;
                display: inline-block;
            }

            .oh5-result-value {
                font-weight: 600;
                color: var(--oh5-ink);
                text-align: center !important;
                display: block;
                font-variant-numeric: tabular-nums;
                word-break: break-word;
            }

            .oh5-flag-slot {
                width: 22px;
                display: inline-flex;
                align-items: center;
                justify-content: center;
                flex-shrink: 0;
            }

            /* Transparent .HL wrapper prevents double concentric rings */
            .HL {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                border: none !important;
                background: transparent !important;
                padding: 0 !important;
                margin: 0 !important;
            }

            .oh5-flag-badge {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                min-width: 17px;
                height: 14px;
                padding: 0 4px;
                border-radius: 3px;
                font-size: 8.2px;
                font-weight: 700;
                letter-spacing: 0.02em;
                background: #f1f5f9;
                color: var(--oh5-ink);
                border: 1px solid #cbd5e1;
                line-height: 1;
            }

            .oh5-flag-badge.is-red {
                background: var(--oh5-danger-bg);
                color: var(--oh5-danger);
                border-color: var(--oh5-danger-border);
            }

            .oh5-result-value.is-abnormal {
                font-weight: 700;
            }

            .oh5-result-value.is-abnormal.is-red {
                color: var(--oh5-danger);
            }

            .oh5-row--abnormal.is-bold-row td {
                font-weight: 700;
            }

            /* Inline cell editing affordance on screen preview only */
            .cell-edit {
                border-radius: 2px;
                padding: 0 2px;
                transition: background 0.15s ease, box-shadow 0.15s ease;
                cursor: text;
            }

            .cell-edit:hover {
                background: #eef2ff;
                box-shadow: inset 0 0 0 1px #c7d2fe;
            }

            .cell-edit:focus {
                outline: none;
                background: #ffffff;
                box-shadow: 0 0 0 2px rgba(30, 58, 95, 0.25);
            }

            /* ================= DOCUMENTED & CLINICAL CARDS ================= */
            .oh5-documented-card {
                margin: 4px 0 7px 0;
                padding: 6px 10px;
                border: 1px solid var(--oh5-border-soft);
                border-radius: 4px;
                background: #ffffff;
                font-size: 10.5px;
                line-height: 1.38;
                color: var(--oh5-ink);
            }

            .oh5-documented-card table {
                width: 100%;
                border-collapse: collapse;
                margin: 4px 0;
            }

            .oh5-documented-card td,
            .oh5-documented-card th {
                border: 1px solid var(--oh5-border);
                padding: 3px 6px;
            }

            .oh5-interpretation-card,
            .oh5-remarks-card {
                margin: 4px 0 7px 0;
                padding: 5px 9px;
                background: var(--oh5-bg-soft);
                border: 1px solid var(--oh5-border-soft);
                border-left: 2.5px solid var(--oh5-teal);
                border-radius: 4px;
                font-size: 9.6px;
                line-height: 1.34;
                color: #334155;
            }

            .oh5-interpretation-title,
            .oh5-remarks-title {
                display: block;
                font-size: 8.8px;
                font-weight: 700;
                color: var(--oh5-teal);
                text-transform: uppercase;
                letter-spacing: 0.05em;
                margin-bottom: 2px;
            }

            .oh5-end-of-report {
                margin: 8px 0 4px 0;
                text-align: center;
                font-size: 8.8px;
                font-weight: 600;
                letter-spacing: 0.14em;
                color: var(--oh5-muted);
                text-transform: uppercase;
            }

            .oh5-end-of-report::before,
            .oh5-end-of-report::after {
                content: "";
                display: inline-block;
                width: 50px;
                height: 1px;
                background: var(--oh5-border);
                vertical-align: middle;
                margin: 0 10px;
            }

            /* ================= FOOTER / SIGNATURES / COMPACT QR ================= */
            .oh5-footer-wrap {
                width: 100%;
                border-top: 1px solid var(--oh5-border);
                padding-top: 5px;
            }

            .oh5-footer-top-row {
                display: flex;
                align-items: flex-end;
                justify-content: space-between;
                gap: 12px;
                width: 100%;
            }

            .oh5-qr-block {
                width: 78px;
                max-width: 82px;
                display: flex;
                flex-direction: column;
                align-items: center;
                text-align: center;
                gap: 2px;
                padding: 3px 4px;
                border: 1px solid var(--oh5-border-soft);
                border-radius: 4px;
                background: var(--oh5-bg-soft);
                flex-shrink: 0;
            }

            .oh5-qr-block img,
            #qrimg {
                width: 44px;
                height: 44px;
                display: block;
                object-fit: contain;
                background: #ffffff;
            }

            .oh5-qr-caption {
                width: 100%;
                line-height: 1.15;
            }

            .oh5-qr-title {
                display: block;
                font-size: 6.8px;
                font-weight: 700;
                color: var(--oh5-navy);
                text-transform: uppercase;
                letter-spacing: 0.03em;
                white-space: nowrap;
            }

            .oh5-signatures {
                flex: 1;
                display: flex;
                align-items: flex-end;
                justify-content: flex-end;
                gap: 14px;
                min-height: 56px;
            }

            .oh5-sign-slot {
                flex: 1;
                max-width: 190px;
                min-width: 105px;
                display: flex;
                flex-direction: column;
                align-items: center;
                text-align: center;
            }

            .oh5-sign-slot.oh5-sign-hidden {
                display: none !important;
            }

            .oh5-sign-img-wrap {
                height: 32px;
                display: flex;
                align-items: flex-end;
                justify-content: center;
                margin-bottom: 2px;
            }

            .oh5-sign-img {
                max-height: 31px;
                max-width: 120px;
                width: auto;
                height: auto;
                object-fit: contain;
                display: block;
            }

            .oh5-sign-rule {
                width: 84%;
                height: 1px;
                background-color: #94a3b8;
                margin-bottom: 3px;
            }

            .oh5-sign-name {
                display: block;
                font-size: 9.2px;
                font-weight: 700;
                color: var(--oh5-ink);
                line-height: 1.2;
            }

            .oh5-sign-role {
                display: block;
                font-size: 7.8px;
                color: var(--oh5-slate);
                font-weight: 500;
                line-height: 1.2;
            }

            .oh5-footer-bottom-meta {
                margin-top: 4px;
                padding-top: 3px;
                border-top: 1px solid var(--oh5-border-soft);
                display: flex;
                align-items: center;
                justify-content: space-between;
                font-size: 7.8px;
                color: var(--oh5-muted);
            }

            .oh5-page-counter {
                font-weight: 600;
                color: #334155;
                font-variant-numeric: tabular-nums;
            }

            /* ================= FLOATING ACTION DOCK ================= */
            .download-pdf-div.oh5-dock {
                position: fixed;
                bottom: 10px;
                left: 50%;
                transform: translateX(-50%);
                z-index: 950;
                display: flex;
                flex-direction: row;
                flex-wrap: nowrap;
                align-items: center;
                justify-content: center;
                gap: 4px;
                padding: 4px 6px;
                width: max-content;
                max-width: calc(100vw - 16px);
                background: rgba(15, 23, 42, 0.94);
                backdrop-filter: blur(12px);
                -webkit-backdrop-filter: blur(12px);
                border: 1px solid rgba(255, 255, 255, 0.14);
                border-radius: 999px;
                box-shadow: 0 8px 24px rgba(15, 23, 42, 0.28);
                box-sizing: border-box;
            }

            /* Center dock cleanly inside .content-box workspace when left sidebar is open */
            @media (min-width: 1025px) {
                .content-box:not(.collapsed) .download-pdf-div.oh5-dock {
                    left: calc(50% + (var(--sidebar-width, 260px) / 2));
                    max-width: calc(100vw - var(--sidebar-width, 260px) - 24px);
                }
            }

            .oh5-dock .downloadDiv {
                position: relative;
                display: inline-flex;
                align-items: center;
                justify-content: center;
                flex: 0 0 auto;
                margin: 0;
                padding: 0;
            }

            .oh5-dock .downloadDiv > a {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                text-decoration: none;
                margin: 0;
                padding: 0;
            }

            .download-pdf-div.oh5-dock button {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                gap: 5px;
                height: 29px;
                min-height: 29px;
                max-height: 29px;
                margin: 0;
                padding: 0 10px;
                border: none;
                border-radius: 999px;
                font-family: inherit;
                font-size: 11.2px;
                font-weight: 600;
                line-height: 1;
                letter-spacing: 0.01em;
                cursor: pointer;
                color: #f8fafc;
                background: rgba(255, 255, 255, 0.11);
                transition: transform 0.14s ease, background 0.14s ease, opacity 0.14s ease;
                white-space: nowrap;
                flex-shrink: 0;
                vertical-align: middle;
                box-sizing: border-box;
            }

            .download-pdf-div.oh5-dock button i {
                font-size: 11px;
                line-height: 1;
                width: 12px;
                height: 12px;
                display: inline-flex;
                align-items: center;
                justify-content: center;
                margin: 0;
                flex-shrink: 0;
            }

            .download-pdf-div.oh5-dock button .oh5-btn-label {
                display: inline-block;
                line-height: 1;
                margin: 0;
            }

            .download-pdf-div.oh5-dock button .btn-audit-chip {
                height: 15px !important;
                min-width: 15px !important;
                padding: 0 4px !important;
                margin: 0 0 0 2px !important;
                font-size: 9px !important;
                line-height: 1 !important;
                display: inline-flex !important;
                align-items: center !important;
                justify-content: center !important;
                border-radius: 999px !important;
                flex-shrink: 0 !important;
                box-sizing: border-box !important;
            }

            .download-pdf-div.oh5-dock button:hover:not(:disabled) {
                background: rgba(255, 255, 255, 0.22);
                transform: translateY(-1px);
            }

            .download-pdf-div.oh5-dock button:disabled {
                opacity: 0.48;
                cursor: not-allowed;
            }

            .download-pdf-div.oh5-dock #signOff.is-signed {
                background: #059669;
                color: #ffffff;
            }

            .download-pdf-div.oh5-dock #downloadPDF {
                background: #2563eb;
                color: #ffffff;
            }

            .download-pdf-div.oh5-dock #downloadPDF:hover:not(:disabled) {
                background: #1d4ed8;
            }

            .download-pdf-div.oh5-dock #BrowserPrint {
                background: #0f766e;
                color: #ffffff;
            }

            .download-pdf-div.oh5-dock #BrowserPrint:hover:not(:disabled) {
                background: #0d9488;
            }

            .oh5-dock .loading-overlay {
                position: absolute;
                inset: 0;
                border-radius: 999px;
                background: rgba(15, 23, 42, 0.72);
                display: none;
                align-items: center;
                justify-content: center;
                pointer-events: none;
            }

            .oh5-dock .lo {
                width: 13px;
                height: 13px;
                border: 2px solid rgba(255, 255, 255, 0.35);
                border-top-color: #ffffff;
                border-radius: 50%;
                animation: oh5Spin 0.7s linear infinite;
            }

            @keyframes oh5Spin {
                to { transform: rotate(360deg); }
            }

            @media (max-width: 1180px) and (min-width: 1025px) {
                .download-pdf-div.oh5-dock {
                    gap: 3px;
                    padding: 3px 5px;
                }
                .download-pdf-div.oh5-dock button {
                    padding: 0 8px;
                    font-size: 10.5px;
                    gap: 4px;
                }
            }

            @media (max-width: 820px) {
                .oh5-viewport {
                    overflow-x: auto;
                    align-items: flex-start;
                }
                .download-pdf-div.oh5-dock {
                    gap: 4px;
                    padding: 4px 6px;
                }
                .download-pdf-div.oh5-dock button {
                    padding: 0 9px;
                    height: 30px;
                    min-height: 30px;
                    max-height: 30px;
                    gap: 3px;
                }
                .download-pdf-div.oh5-dock button .oh5-btn-label {
                    display: none;
                }
            }

            @media print {
                @page {
                    size: A4;
                    margin: 0;
                }
                body * {
                    visibility: visible;
                }
                .oh5-page-root {
                    background: #ffffff !important;
                    padding-bottom: 0 !important;
                    min-height: auto !important;
                }
                .no-print,
                .oh5-topbar,
                .oh5-dock,
                .oh5-modal,
                .oh5-toast-stack,
                .oh5-skeleton-wrap {
                    display: none !important;
                }
                .oh5-viewport {
                    padding: 0 !important;
                }
                .oh5-sheet-stack {
                    gap: 0 !important;
                }
                .oh5-sheet {
                    box-shadow: none !important;
                    border-radius: 0 !important;
                    page-break-after: always;
                    break-after: page;
                }
                .oh5-sheet:last-child {
                    page-break-after: auto;
                    break-after: auto;
                }
                .cell-edit {
                    background: transparent !important;
                    box-shadow: none !important;
                    padding: 0 !important;
                }
            }
        </style>

        <!-- ================= STICKY TOP CONTEXT BAR ================= -->
        <header class="oh5-topbar no-print" id="oh5TopBar">
            <div class="oh5-topbar-left">
                <span class="oh5-format-chip">
                    <i class="fas fa-file-medical-alt"></i>
                    Format 5
                </span>
                <div class="oh5-patient-summary" id="oh5TopSummary">
                    Loading patient details...
                </div>
            </div>
            <div class="oh5-topbar-right">
                <span class="oh5-status-pill is-pending" id="oh5SignStatusPill">
                    <i class="fas fa-clock"></i> Pending Sign-Off
                </span>
                <span class="oh5-status-pill" id="oh5CatModePill" style="display:none;">
                    <i class="fas fa-layer-group"></i> Category Break
                </span>
                <label class="oh5-rowgap-control" title="Customize vertical spacing between test rows (0–12)">
                    <span>Gap:</span>
                    <input type="range" id="oh5RowGapInput" min="0" max="12" step="1" value="1" />
                    <span class="oh5-rowgap-val" id="oh5RowGapVal">1</span>
                </label>
                <label class="oh5-letterhead-toggle" title="Toggle letterhead artwork preview & PDF background">
                    <input type="checkbox" id="oh5WithoutLetterhead" />
                    <span>Without Letterhead</span>
                </label>
            </div>
        </header>

        <!-- ================= SKELETON LOADING PLACEHOLDER ================= -->
        <div id="oh5Skeleton" class="oh5-skeleton-wrap no-print" aria-busy="true">
            <div class="oh5-skel-line" style="width: 35%; height: 18px; margin-bottom: 18px;"></div>
            <div class="oh5-skel-line oh5-skel-card"></div>
            <div class="oh5-skel-line" style="width: 100%; height: 26px;"></div>
            <div class="oh5-skel-line" style="width: 96%;"></div>
            <div class="oh5-skel-line" style="width: 92%;"></div>
            <div class="oh5-skel-line" style="width: 98%;"></div>
            <div class="oh5-skel-line" style="width: 85%;"></div>
            <div class="oh5-skel-line" style="width: 90%;"></div>
        </div>

        <!-- ================= PAGINATED A4 PREVIEW VIEWPORT ================= -->
        <main class="oh5-viewport">
            <div id="container" data-report-section="document-root" style="display:none;">
                <div class="oh5-sheet-stack" id="sheetStackWrap">
                    <!-- Paginated A4 sheets are mounted dynamically by reportFormat5.js -->
                </div>
            </div>
        </main>

        <!-- ================= FLOATING ACTION DOCK ================= -->
        <div class="download-pdf-div oh5-dock no-print" role="toolbar" aria-label="Format 5 Report Actions">
            <div class="downloadDiv">
                <button id="signOff" type="button" title="Toggle Report Sign-Off">
                    <i class="fas fa-signature"></i>
                    <span class="oh5-btn-label">Sign Off</span>
                </button>
                <div class="loading-overlay"><div class="lo"></div></div>
            </div>

            <div class="downloadDiv">
                <button id="enterResult" type="button" title="Enter or Update Test Results">
                    <i class="fas fa-pen-to-square"></i>
                    <span class="oh5-btn-label">Enter Result</span>
                </button>
            </div>

            <div class="downloadDiv">
                <button id="savePDF" type="button" title="Save Edited Report Values">
                    <i class="fas fa-floppy-disk"></i>
                    <span class="oh5-btn-label">Save</span>
                </button>
                <div class="loading-overlay"><div class="lo"></div></div>
            </div>

            <div class="downloadDiv">
                <button id="downloadPDF" class="sign click" type="button" title="Download PDF" data-default-title="Download PDF">
                    <i class="fas fa-file-pdf"></i>
                    <span class="oh5-btn-label">Download</span>
                </button>
                <div class="loading-overlay"><div class="lo"></div></div>
            </div>

            <div class="downloadDiv">
                <button id="sendReport" class="sign click" type="button" title="Send Report (SMS / WhatsApp / Email)" data-default-title="Send Report (SMS / WhatsApp / Email)">
                    <i class="fas fa-paper-plane"></i>
                    <span class="oh5-btn-label">Send</span>
                </button>
                <div class="loading-overlay"><div class="lo"></div></div>
            </div>

            <div class="downloadDiv">
                <button id="BrowserPrint" class="sign click" type="button" title="Browser Print" data-default-title="Browser Print">
                    <i class="fas fa-print"></i>
                    <span class="oh5-btn-label">Print</span>
                </button>
                <div class="loading-overlay"><div class="lo"></div></div>
            </div>

            <div class="downloadDiv" id="printsettingbutton">
                <a href="pages/pages/printsetting.html" id="PDFsettinganchr">
                    <button id="PDFsetting" class="sign click" type="button" title="Print Settings">
                        <i class="fas fa-sliders"></i>
                        <span class="oh5-btn-label">Settings</span>
                    </button>
                </a>
                <div class="loading-overlay"><div class="lo"></div></div>
            </div>
        </div>

        <!-- ================= SHARE & PREVIEW MODAL (PORTALED TO BODY AT RUNTIME) ================= -->
        <div id="popupModal" class="oh5-modal popup-modal no-print" role="dialog" aria-modal="true" aria-label="Send Clinical Report">
            <div class="oh5-modal-card">
                <div class="oh5-modal-head">
                    <div class="oh5-share-tabs">
                        <button id="smsButton" type="button"><i class="fas fa-comment-sms"></i> SMS</button>
                        <button id="whatsappButton" type="button"><i class="fab fa-whatsapp"></i> WhatsApp</button>
                        <button id="emailButton" type="button"><i class="fas fa-envelope"></i> Email</button>
                        <button id="openPdfButton" type="button"><i class="fas fa-up-right-from-square"></i> Open PDF</button>
                    </div>
                    <button class="close-button oh5-close-modal" type="button" aria-label="Close">&times;</button>
                </div>
                <div id="inputField" class="oh5-contact-bar">
                    <input id="contactInput" type="text" placeholder="Enter mobile number or email address" />
                    <button id="sendButton" type="button">Send Now</button>
                </div>
                <iframe id="pdfFrame" src="" class="oh5-pdf-frame" title="Format 5 PDF Preview"></iframe>
            </div>
        </div>

        <!-- ================= TOAST NOTIFICATION STACK ================= -->
        <div id="toastStack" class="oh5-toast-stack no-print" aria-live="polite" aria-atomic="false"></div>
    </div>

    <noscript>
        <p style="text-align:center;padding:24px;font-family:sans-serif;">
            JavaScript is required to view and generate Format 5 diagnostic reports.
        </p>
    </noscript>

    <script src="report_action_audit.js"></script>
    <script src="reportFormat5.js"></script>
</body>

</html>
