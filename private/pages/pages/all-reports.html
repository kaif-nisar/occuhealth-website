<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>All Reports — Download & Manage</title>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" />
    <!-- Tailwind CSS (kept for utility classes only; core layout is custom CSS) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* ============================================================
           ALL REPORTS — THEME ALIGNED WITH SPA SHELL (admin.html)
           Primary #3f4d67 · Background #f2edf3 · 6px radius · flat borders
           ============================================================ */

        :root {
            --color: #3f4d67;              /* matches admin.css --color */
            --color-hover: #344258;
            --base: #ffffff;
            --border-color: #dee2e6;       /* matches sibling pages */
            --text-muted: #6b7280;
            --shadow-sm: 0 2px 4px rgba(0, 0, 0, 0.08);
            --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.15);
            --radius: 6px;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            background: #f2edf3;           /* matches admin shell body bg */
            color: #333;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, Helvetica, sans-serif;
            font-size: 0.875rem;
        }

        .page-container {
            width: 96%;
            max-width: 1400px;
            margin: 24px auto;
        }

        /* ---------- Cards ---------- */
        .card {
            background: var(--base);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            box-shadow: var(--shadow-sm);
        }

        .hidden {
            display: none !important;
        }

        /* ---------- Page Header ---------- */
        .page-header {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 16px;
        }
        .page-header h1 {
            font-size: 22px;
            font-weight: 700;
            color: #1f2937;
            margin: 0;
            letter-spacing: -0.01em;
        }
        .page-header p {
            font-size: 13px;
            color: var(--text-muted);
            margin: 4px 0 0;
        }
        .breadcrumb {
            font-size: 13px;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }
        .breadcrumb a {
            color: var(--text-muted);
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            transition: color 0.15s ease;
        }
        .breadcrumb a:hover {
            color: var(--color);
            text-decoration: underline;
        }
        .breadcrumb i.fa-chevron-right {
            font-size: 10px;
            color: #9ca3af;
        }
        .breadcrumb .current {
            color: #1f2937;
            font-weight: 500;
        }

        /* ---------- Filter Card ---------- */
        .filter-card {
            padding: 16px;
            margin-bottom: 16px;
        }
        .filter-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
            gap: 12px;
            align-items: end;
        }
        .filter-grid > div {
            display: flex;
            flex-direction: column;
        }
        .filter-grid label {
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 5px;
            color: #444;
        }
        .filter-grid select,
        .filter-grid input[type="date"] {
            padding: 8px 10px;
            font-size: 13px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            min-height: 38px;
            outline: none;
            background: #fff;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .filter-grid select:focus,
        .filter-grid input[type="date"]:focus {
            border-color: var(--color);
            box-shadow: 0 0 0 2px rgba(63, 77, 103, 0.15);
        }
        #search-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            padding: 9px 20px;
            font-size: 13px;
            font-weight: 600;
            border: none;
            border-radius: var(--radius);
            background: var(--color);
            color: #fff;
            cursor: pointer;
            height: 38px;
            line-height: 1;
            transition: all 0.15s ease;
        }
        #search-button:hover {
            background: var(--color-hover);
            box-shadow: var(--shadow-md);
        }
        #search-button i {
            font-size: 12px;
        }

        /* ---------- Action Toolbar (above table) ---------- */
        .action-toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
            margin: 16px 0 12px;
        }
        .results-count {
            font-size: 13px;
            color: var(--text-muted);
            font-weight: 500;
        }
        .results-count strong {
            color: #1f2937;
        }
        .toolbar-actions {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .toolbar-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .toolbar-label {
            font-size: 12px;
            font-weight: 600;
            color: #475569;
            white-space: nowrap;
        }

        /* ---------- Letterhead Segmented Control ---------- */
        .seg-control {
            display: inline-flex;
            background: #f8f9fb;
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 3px;
            gap: 2px;
        }
        .seg-option {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 5px 10px;
            border-radius: 4px;
            border: none;
            background: transparent;
            color: var(--text-muted);
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s ease;
            white-space: nowrap;
        }
        .seg-option:hover {
            color: #333;
        }
        .seg-option.active {
            background: var(--base);
            color: var(--color);
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.08);
            border: 1px solid var(--border-color);
        }
        .seg-option i {
            font-size: 11px;
        }

        /* ---------- Action Buttons ---------- */
        .btn-action {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 8px 16px;
            border-radius: var(--radius);
            font-size: 13px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: all 0.15s ease;
            color: #fff;
            line-height: 1;
        }
        .btn-action i {
            font-size: 12px;
        }
        .btn-action:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .btn-download {
            background: var(--color);
        }
        .btn-download:hover:not(:disabled) {
            background: var(--color-hover);
            box-shadow: var(--shadow-md);
        }
        .btn-download.is-downloading {
            background: #dc2626;
        }
        .btn-download.is-downloading:hover:not(:disabled) {
            background: #b91c1c;
        }
        .btn-merge {
            background: #10b981;
        }
        .btn-merge:hover:not(:disabled) {
            background: #059669;
            box-shadow: var(--shadow-md);
        }

        /* ---------- Search Row (icon/text overlap fix) ---------- */
        .search-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
        }
        .search-row label {
            font-size: 13px;
            font-weight: 600;
            color: #444;
            white-space: nowrap;
        }
        .search-input-wrap {
            position: relative;
            width: 100%;
            max-width: 360px;
        }
        .search-input-wrap i {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: #9ca3af;
            font-size: 13px;
            pointer-events: none;      /* icon never blocks clicks/typing */
            z-index: 1;
        }
        .search-input-wrap input {
            width: 100%;
            padding: 8px 12px 8px 36px;  /* left padding clears the icon */
            font-size: 13px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            outline: none;
            background: #fff;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .search-input-wrap input:focus {
            border-color: var(--color);
            box-shadow: 0 0 0 2px rgba(63, 77, 103, 0.15);
        }

        /* ---------- Table ---------- */
        .table-card {
            overflow: hidden;
        }
        .table-container {
            overflow-x: auto;
        }
        table {
            width: 100%;
            min-width: 820px;
            border-collapse: collapse;
            background: #fff;
        }
        thead th {
            padding: 12px 14px;
            text-align: left;
            background: #f8f9fb;
            font-weight: 700;
            font-size: 12px;
            color: #6b7280;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            border-bottom: 2px solid #e5e7eb;
            white-space: nowrap;
            position: sticky;
            top: 0;
            z-index: 5;
        }
        tbody td {
            padding: 12px 14px;
            text-align: left;
            font-size: 13px;
            color: #1f2937;
            border-bottom: 1px solid rgba(0, 0, 0, 0.06);
            vertical-align: middle;
        }
        tbody tr:last-child td {
            border-bottom: none;
        }
        tbody tr.data-row {
            transition: background-color 0.15s ease;
        }
        tbody tr.data-row:hover {
            background: #f9fafb;
        }
        .td-tests {
            line-height: 1.6;
            font-size: 12px;
        }

        /* ---------- Booking ID badge (download trigger) ---------- */
        .booking-id-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            border-radius: 9999px;
            background: #eef1f6;
            color: var(--color);
            border: 1px solid #d6dde8;
            font-weight: 600;
            font-size: 12px;
            letter-spacing: 0.01em;
            text-decoration: none;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.15s ease;
        }
        .booking-id-badge .booking-id-icon {
            font-size: 11px;
            opacity: 0.7;
        }
        .booking-id-badge:hover {
            background: #e2e8f0;
            border-color: var(--color);
            text-decoration: underline;
            text-underline-offset: 3px;
            box-shadow: 0 0 0 3px rgba(63, 77, 103, 0.10);
        }
        .booking-id-badge.is-loading {
            background: #f5f5f5;
            border-color: #9ca3af;
            color: #6b7280;
            cursor: default;
            pointer-events: none;
            animation: pulseGlow 1.2s ease-in-out infinite;
        }
        @keyframes pulseGlow {
            0%, 100% { box-shadow: 0 0 0 0 rgba(63, 77, 103, 0.20); }
            50%      { box-shadow: 0 0 0 5px rgba(63, 77, 103, 0.05); }
        }

        /* ---------- Status badge ---------- */
        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            border: 1px solid transparent;
            white-space: nowrap;
        }

        /* ---------- Checkboxes ---------- */
        .report-checkbox,
        #selectAllCheckbox {
            width: 15px;
            height: 15px;
            accent-color: var(--color);
            cursor: pointer;
        }

        /* ---------- Skeleton shimmer ---------- */
        .skeleton-row .skeleton-cell {
            padding: 13px 14px;
        }
        .skeleton {
            display: block;
            background: linear-gradient(90deg, #e9ecef 25%, #f6f7f9 37%, #e9ecef 63%);
            background-size: 400% 100%;
            animation: shimmer 1.4s ease infinite;
            border-radius: 4px;
        }
        @keyframes shimmer {
            0%   { background-position: 100% 0; }
            100% { background-position: -100% 0; }
        }
        .skeleton-checkbox { width: 15px; height: 15px; border-radius: 3px; }
        .skeleton-short    { width: 64px;  height: 13px; }
        .skeleton-medium   { width: 120px; height: 13px; }
        .skeleton-long     { width: 230px; height: 13px; }
        .skeleton-badge    { width: 92px;  height: 22px; border-radius: 9999px; }

        /* ---------- Empty / Error state ---------- */
        .state-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 48px 24px;
            text-align: center;
        }
        .state-icon {
            width: 56px;
            height: 56px;
            border-radius: 8px;
            background: #eef1f6;
            color: var(--color);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 16px;
        }
        .state-icon svg {
            width: 26px;
            height: 26px;
        }
        .state-icon-error {
            background: #feecec;
            color: #dc2626;
        }
        .state-title {
            font-size: 15px;
            font-weight: 700;
            color: #1f2937;
        }
        .state-description {
            font-size: 13px;
            color: #6b7280;
            margin-top: 6px;
            max-width: 420px;
            line-height: 1.5;
        }
        .retry-button {
            margin-top: 18px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 18px;
            border-radius: var(--radius);
            background: var(--color);
            color: #fff;
            font-size: 13px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: all 0.15s ease;
        }
        .retry-button:hover {
            background: var(--color-hover);
            box-shadow: var(--shadow-md);
        }
        .no-results-cell {
            padding: 36px 24px;
            text-align: center;
            color: var(--text-muted);
        }

        /* ---------- Toast system ---------- */
        .toast-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-width: 400px;
            width: calc(100% - 40px);
            pointer-events: none;
        }
        .toast {
            pointer-events: auto;
            display: flex;
            align-items: flex-start;
            gap: 12px;
            padding: 13px 44px 13px 13px;
            border-radius: 8px;
            background: #fff;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.14);
            border-left: 4px solid var(--color);
            position: relative;
            overflow: hidden;
            transform: translateX(120%);
            opacity: 0;
            transition: transform 0.3s ease, opacity 0.3s ease;
        }
        .toast.show {
            transform: translateX(0);
            opacity: 1;
        }
        .toast.hide {
            transform: translateX(120%);
            opacity: 0;
        }
        .toast-info    { border-left-color: var(--color); }
        .toast-info .toast-icon    { color: var(--color); }
        .toast-success { border-left-color: #10b981; }
        .toast-success .toast-icon { color: #10b981; }
        .toast-error   { border-left-color: #dc2626; }
        .toast-error .toast-icon   { color: #dc2626; }
        .toast-icon {
            font-size: 1.1rem;
            margin-top: 1px;
        }
        .toast-title {
            font-weight: 700;
            font-size: 13px;
            color: #1f2937;
        }
        .toast-message {
            font-size: 12px;
            color: #6b7280;
            margin-top: 3px;
            line-height: 1.45;
        }
        .toast-close {
            position: absolute;
            top: 10px;
            right: 10px;
            background: none;
            border: none;
            color: #9ca3af;
            cursor: pointer;
            font-size: 12px;
            padding: 4px;
            border-radius: 4px;
            transition: color 0.15s ease;
        }
        .toast-close:hover {
            color: #374151;
        }
        .toast-progress {
            position: absolute;
            bottom: 0;
            left: 0;
            height: 3px;
            width: 100%;
            background: rgba(63, 77, 103, 0.30);
            transform-origin: left;
            animation: toastProgress var(--toast-duration, 4000ms) linear forwards;
        }
        .toast-success .toast-progress { background: rgba(16, 185, 129, 0.35); }
        .toast-error .toast-progress   { background: rgba(220, 38, 38, 0.35); }
        @keyframes toastProgress {
            from { transform: scaleX(1); }
            to   { transform: scaleX(0); }
        }

        /* ---------- Legacy global loader (kept for compatibility) ---------- */
        #loader1 {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.45);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 99999;
        }
        #loader1 .spinner1 {
            width: 36px;
            height: 36px;
            border: 3px solid #e2e8f0;
            border-top-color: var(--color);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        #loader1 p {
            color: #fff;
            margin-left: 12px;
            font-size: 13px;
            font-weight: 500;
        }
    </style>
</head>

<body>
    <div class="page-container">

        <!-- ============ PAGE HEADER ============ -->
        <div class="page-header">
            <div>
                <h1>All Reports</h1>
                <p>Download and manage patient reports</p>
            </div>
            <!-- Breadcrumb -->
            <nav class="breadcrumb" aria-label="Breadcrumb">
                <a href="#" data-page="dashboard">
                    <i class="fas fa-home" style="font-size:12px;"></i>
                    Dashboard
                </a>
                <i class="fas fa-chevron-right" aria-hidden="true"></i>
                <span class="current">All Reports</span>
            </nav>
        </div>

        <!-- ============ FILTER CARD ============ -->
        <div class="card filter-card">
            <div class="filter-grid">
                <div>
                    <label for="quick-date-range">Quick Date Range</label>
                    <select id="quick-date-range">
                        <option value="">-- Quick Date Range --</option>
                        <option value="1">Last 1 Month</option>
                        <option value="2">Last 2 Months</option>
                        <option value="3">Last 3 Months</option>
                        <option value="6">Last 6 Months</option>
                        <option value="12">Last 1 Year</option>
                    </select>
                </div>
                <div>
                    <label for="start-date">From</label>
                    <input id="start-date" type="date" />
                </div>
                <div>
                    <label for="end-date">To</label>
                    <input id="end-date" type="date" />
                </div>
                <div>
                    <label for="franchisee-select">Franchisee</label>
                    <select id="franchisee-select">
                        <option value="">-- Self --</option>
                    </select>
                </div>
                <div>
                    <label>&nbsp;</label>
                    <button id="search-button" type="button">
                        <i class="fas fa-search"></i> Search
                    </button>
                </div>
            </div>
        </div>

        <!-- ============ ACTION TOOLBAR (letterhead + download actions) ============ -->
        <div class="action-toolbar">
            <span class="results-count" id="results-count">Loading reports…</span>
            <div class="toolbar-actions">

                <!-- Letterhead preference (persisted) — prominent & adjacent to download actions -->
                <div class="toolbar-group">
                    <span class="toolbar-label">Report Format</span>
                    <div class="seg-control" id="letterhead-seg" role="group" aria-label="Report format">
                        <button type="button" class="seg-option active" data-value="without" aria-pressed="true">
                            <i class="fas fa-file" aria-hidden="true"></i> Without Letterhead
                        </button>
                        <button type="button" class="seg-option" data-value="with" aria-pressed="false">
                            <i class="fas fa-file-signature" aria-hidden="true"></i> With Letterhead
                        </button>
                    </div>
                    <!-- Hidden select kept for backward compatibility -->
                    <select id="myselect" class="hidden" aria-hidden="true" tabindex="-1">
                        <option value="without">without letter pad</option>
                        <option value="with">with letter pad</option>
                    </select>
                </div>

                <button class="btn-action btn-download" id="download-selected-reports" type="button">
                    <i class="fas fa-download"></i>
                    <span class="btn-label">Download Selected Reports</span>
                </button>
                <button class="btn-action btn-merge hidden" id="merge-selected-reports" type="button">
                    <i class="fas fa-file-pdf"></i>
                    <span class="btn-label">Merge Reports</span>
                </button>
            </div>
        </div>

        <!-- ============ SEARCH ROW (icon overlap fixed) ============ -->
        <div class="search-row">
            <label for="search-input">Search:</label>
            <div class="search-input-wrap">
                <i class="fas fa-search" aria-hidden="true"></i>
                <input type="text" id="search-input" placeholder="Search by booking ID, patient, test…" />
            </div>
        </div>

        <!-- ============ TABLE CARD ============ -->
        <div class="card table-card">
            <div class="table-container">
                <table aria-label="Reports table">
                    <thead>
                        <tr>
                            <th scope="col" style="width: 40px;">
                                <input type="checkbox" id="selectAllCheckbox" title="Select All" aria-label="Select all reports" />
                            </th>
                            <th scope="col">Booking ID</th>
                            <th scope="col">Patient Name</th>
                            <th scope="col">Barcodes</th>
                            <th scope="col">Ref By</th>
                            <th scope="col">Test Name</th>
                            <th scope="col">Status</th>
                        </tr>
                    </thead>
                    <tbody id="tab">
                        <!-- Rows injected by JS (skeleton / data / empty / error) -->
                    </tbody>
                </table>
            </div>
        </div>

        <!-- ============ LEGACY GLOBAL LOADER (kept for compatibility) ============
             NOTE: No `hidden` class here — CSS defaults to display:none, and the JS
             toggles inline style.display ('flex'/'none') so it must not be blocked
             by an !important utility class. -->
        <div id="loader1">
            <div class="spinner1"></div>
            <p>Generating PDF...</p>
        </div>

        <!-- ============ TOAST CONTAINER ============ -->
        <div id="toast-container" class="toast-container" aria-live="polite"></div>

    </div>
</body>

</html>
