<!DOCTYPE html>
<html lang="en">

<head>
    <title>All Cases</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        :root {
            /* --color: #007bff; */
            --base: #ffffff;
            --border-color: #dee2e6;
            --text-muted: #6b7280;
            --shadow-sm: 0 2px 4px rgba(0,0,0,0.08);
            --shadow-md: 0 4px 12px rgba(0,0,0,0.15);
            --radius: 6px;
        }

        h1 {
            font-size: 29px;
            font-weight: bold;
            margin: 20px;
            margin-top: 4%;
        }

        .container-allcases {
            width: 100%;
            overflow-x: auto;
            overflow-y: visible;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: thin;
            scrollbar-color: #c1c1c1 #f1f1f1;
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            background: #fff;
        }
        .container-allcases::-webkit-scrollbar {
            height: 8px;
        }
        .container-allcases::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 4px;
        }
        .container-allcases::-webkit-scrollbar-thumb {
            background: #c1c1c1;
            border-radius: 4px;
        }
        .container-allcases::-webkit-scrollbar-thumb:hover {
            background: #a1a1a1;
        }

        .filter-section {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
            align-items: flex-end;
        }
        .filter-section>div {
            display: flex;
            flex-direction: column;
        }
        .filter-section label {
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 5px;
            color: #444;
        }
        .filter-section input,
        .filter-section select {
            padding: 8px 10px;
            font-size: 13px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            min-width: 140px;
            transition: border-color 0.2s;
        }
        .filter-section input:focus,
        .filter-section select:focus {
            outline: none;
            border-color: #0d6efd;
            box-shadow: 0 0 0 2px rgba(0,123,255,0.15);
        }
        .filter-section .buttons {
            display: flex;
            flex-direction: row;
            align-items: flex-end;
            gap: 10px;
        }
        .filter-section .buttons button {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 9px 22px;
            font-size: 13px;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            letter-spacing: 0.2px;
            line-height: 1;
        }
        .filter-section .buttons button i {
            font-size: 13px;
        }

        /* --- Search button --- */
        .filter-section .buttons .search-btn {
            background: #0d6efd;
            color: #fff;
            box-shadow: 0 1px 3px rgba(13, 110, 253, 0.2), 0 1px 2px rgba(13, 110, 253, 0.1);
        }
        .filter-section .buttons .search-btn:hover {
            background: #0b5ed7;
            box-shadow: 0 4px 12px rgba(13, 110, 253, 0.35);
            transform: translateY(-1px);
        }
        .filter-section .buttons .search-btn:active {
            background: #0a58ca;
            transform: translateY(0);
            box-shadow: 0 1px 2px rgba(13, 110, 253, 0.2);
        }

        /* --- Clear button --- */
        .filter-section .buttons .clear-btn {
            background: #fff;
            color: #374151;
            border: 1.5px solid #d1d5db;
            box-shadow: 0 1px 2px rgba(0,0,0,0.04);
        }
        .filter-section .buttons .clear-btn:hover {
            background: #f9fafb;
            border-color: #9ca3af;
            color: #111827;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }
        .filter-section .buttons .clear-btn:active {
            background: #f3f4f6;
            transform: scale(0.97);
        }

        /* ============ TABLE ============ */
        table {
            width: 100%;
            min-width: 950px;
            border-collapse: collapse;
            background-color: #ffffff;
            white-space: nowrap;
        }

        /* --- Header cells --- */
        table th {
            padding: 12px 16px;
            text-align: left;
            background-color: #f8f9fb;
            font-weight: 700;
            font-size: 12px;
            color: #6b7280;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            border-bottom: 2px solid #e5e7eb;
            position: sticky;
            top: 0;
            z-index: 2;
        }

        /* --- Body cells --- */
        table td {
            padding: 12px 16px;
            text-align: left;
            font-size: 13px;
            color: #1f2937;
            vertical-align: middle;
            border-bottom: 1px solid rgba(0, 0, 0, 0.06);
        }

        /* --- Row hover --- */
        table tbody tr {
            transition: background-color 0.15s ease;
        }
        table tbody tr:hover {
            background-color: #f9fafb;
        }

        /* ---- Status badge ---- */
        table td .status-btn {
            padding: 5px 12px;
            color: white;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: transform 0.15s, box-shadow 0.15s;
            white-space: nowrap;
        }
        table td .status-btn:hover {
            transform: scale(1.05);
            box-shadow: var(--shadow-sm);
        }

        /* ============ ACTION BUTTONS ============ */
        /* --- Action column cell --- */
        table td.actions {
            position: relative;
            white-space: nowrap;
            min-width: 200px;
        }

        /* --- Actions flex wrapper --- */
        .actions-wrapper {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            justify-content: flex-start;
            vertical-align: middle;
        }

        /* --- Shared button base --- */
        .btn-action {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 6px 14px;
            font-size: 12px;
            font-weight: 600;
            line-height: 1;
            border-radius: 6px;
            cursor: pointer;
            text-decoration: none;
            white-space: nowrap;
            transition: all 0.18s ease;
            border: 1.5px solid transparent;
        }
        .btn-action i {
            font-size: 11px;
        }

        /* --- Primary: Enter Result / View Report --- */
        .btn-action.btn-primary {
            background-color: #0d6efd;
            color: #ffffff;
            border-color: #0d6efd;
        }
        .btn-action.btn-primary:hover {
            background-color: #0b5ed7;
            border-color: #0b5ed7;
            box-shadow: 0 2px 8px rgba(13, 110, 253, 0.3);
        }

        /* --- Secondary / Outline: Edit --- */
        .btn-action.btn-outline {
            background-color: #ffffff;
            color: #0d6efd;
            border-color: #d1d5db;
        }
        .btn-action.btn-outline:hover {
            background-color: #f0f5ff;
            border-color: #0d6efd;
            color: #0b5ed7;
        }

        /* ---- Three-dots ---- */
        .more-options {
            cursor: pointer;
            width: 32px;
            height: 32px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            color: #6b7280;
            font-size: 15px;
            transition: background 0.2s, color 0.2s;
            margin-left: 10px;
            user-select: none;
            flex-shrink: 0;
        }
        .more-options:hover {
            background: #f3f4f6;
            color: #374151;
        }

        /* ---- Dropdown Menu ---- */
        .allcases-dropdown-menu {
            position: absolute;
            top: calc(100% + 4px);
            right: 4px;
            background-color: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            padding: 6px 0;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.14);
            z-index: 1000;
            min-width: 170px;
            animation: dropdownFadeIn 0.15s ease-out;
        }
        @keyframes dropdownFadeIn {
            from { opacity: 0; transform: translateY(-6px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        .allcases-dropdown-menu a {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 9px 16px;
            text-decoration: none;
            color: #333;
            font-size: 13px;
            font-weight: 500;
            transition: background 0.15s, color 0.15s;
            white-space: nowrap;
        }
        .allcases-dropdown-menu a i {
            width: 16px;
            text-align: center;
            color: #6b7280;
            font-size: 13px;
        }
        .allcases-dropdown-menu a:hover {
            background-color: #f3f4f6;
            color: #111;
        }
        .allcases-dropdown-menu a:hover i {
            color: #0d6efd;
        }
        .allcases-dropdown-menu a.danger-item {
            color: #d9534f;
        }
        .allcases-dropdown-menu a.danger-item i {
            color: #d9534f;
        }
        .allcases-dropdown-menu a.danger-item:hover {
            background-color: #fef2f2;
        }

        .ModifyCase i {
            width: 1.15rem;
        }

        /* ---- Popup / Message Popup ---- */
        #messagePopup {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 24px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            z-index: 1000;
            border-radius: 12px;
            width: min(420px, calc(100vw - 32px));
        }
        #messagePopup h3 {
            margin: 0 0 10px;
            font-size: 17px;
            font-weight: 700;
            color: #222;
        }
        #messages {
            height: 120px;
            overflow-y: auto;
            background: #f9fafb;
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid #e5e7eb;
        }
        #messageInput {
            width: 100%;
            height: 60px;
            margin: 12px 0;
            padding: 10px;
            border: 1.5px solid #d1d5db;
            border-radius: var(--radius);
            font-size: 13px;
            resize: none;
            transition: border-color 0.2s;
            box-sizing: border-box;
        }
        #messageInput:focus {
            outline: none;
            border-color: #0d6efd;
            box-shadow: 0 0 0 2px rgba(0,123,255,0.15);
        }
        #sendMessage {
            padding: 9px 22px;
            background-color: #0d6efd;
            color: white;
            border: none;
            border-radius: var(--radius);
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: background 0.2s;
        }
        #sendMessage:hover {
            background-color: #0056b3;
        }
        #closePopup {
            padding: 9px 22px;
            background-color: #e5e7eb;
            color: #333;
            border: none;
            border-radius: var(--radius);
            cursor: pointer;
            margin-left: 8px;
            font-size: 13px;
            font-weight: 600;
            transition: background 0.2s;
        }
        #closePopup:hover {
            background-color: #d1d5db;
        }

        /* Overlay styles */
        #popupOverlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 999;
            backdrop-filter: blur(2px);
        }

        .senderdivs p {
            padding: 0.35rem 0.7rem;
            border-radius: 8px 8px 2px 8px;
            background-color: #4b5563;
            width: fit-content;
            color: white;
            font-size: 13px;
            line-height: 1.4;
            max-width: 80%;
        }
        .receiverdivs,
        .senderdivs {
            margin-bottom: 4px;
        }
        .receiverdivs {
            display: flex;
            justify-content: right;
        }
        .receiverdivs p {
            padding: 0.35rem 0.7rem;
            border-radius: 8px 8px 8px 2px;
            background-color: #059669;
            width: fit-content;
            color: white;
            font-size: 13px;
            line-height: 1.4;
            max-width: 80%;
        }

        .preNext {
            margin: 1.5rem 0;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }
        .preNext button {
            padding: 7px 18px;
            font-size: 13px;
            font-weight: 600;
            border: 1.5px solid #d1d5db;
            border-radius: var(--radius);
            background: white;
            color: #333;
            cursor: pointer;
            transition: all 0.2s;
        }
        .preNext button:hover:not(:disabled) {
            background: #f0f7ff;
            border-color: #0d6efd;
            color: #0d6efd;
        }
        .preNext button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        .preNext span {
            padding: 0 8px;
            font-size: 13px;
            font-weight: 600;
            color: #555;
        }

        .totalbarbook {
            font-family: 'Segoe UI', sans-serif;
            padding: 6px 0;
            font-weight: 600;
            font-size: 13px;
            letter-spacing: 0.3px;
            color: #444;
        }
        .totalbarbook span {
            color: #165524;
            margin-right: 12px;
        }

        /* Attachment UI Styles */
        .attachment-btn {
            cursor: pointer;
            color: #0d6efd;
            position: relative;
            display: inline-block;
            font-size: 18px;
            transition: transform 0.2s;
        }
        .attachment-btn:hover {
            transform: scale(1.1);
        }
        .attachment-count {
            position: absolute;
            top: -10px;
            right: -10px;
            background: #e74c3c;
            color: white;
            border-radius: 50%;
            width: 18px;
            height: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            font-weight: bold;
            border: 2px solid white;
        }
        .attach-list {
            max-height: 200px;
            overflow-y: auto;
            margin: 15px 0;
            border: 1px solid #eee;
            border-radius: 6px;
        }
        .attach-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            border-bottom: 1px solid #f5f5f5;
        }
        .attach-item:last-child { border-bottom: none; }
        .attach-info { display: flex; align-items: center; gap: 10px; }
        .attach-name { font-size: 13px; max-width: 250px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .remove-attach { color: #d9534f; cursor: pointer; transition: 0.2s; }
        .remove-attach:hover { color: #c9302c; }
        .attachment-hint {
            font-size: 12px;
            color: #6b7280;
            margin-top: 6px;
            line-height: 1.5;
        }
        #attachmentModal {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 24px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.25);
            z-index: 1001;
            width: min(440px, calc(100vw - 24px));
            max-height: calc(100vh - 24px);
            overflow-y: auto;
            border-radius: 12px;
        }
    </style>
</head>

<body>
        <h1>All Cases</h1>
        <div class="filter-section">
            <div>
                <label for="reg-no">Booking No.</label>
                <input type="text" id="reg-no">
            </div>
            <div>
                <label for="patient-name">Patient Name</label>
                <input type="text" id="patient-name">
            </div>
            <div>
                <label for="franchisee" id="labelforchange">Franchisee</label>
                <input type="text" id="franchisee">
            </div>
            <div>
                <label for="gender">Gender</label>
                <select id="gender">
                    <option value="">Select</option>
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                    <option value="Other">Other</option>
                </select>
            </div>
            <div>
                <label for="patient-phone">Patient Phone</label>
                <input type="text" id="patient-phone">
            </div>
            <div>
                <label for="barcode">barcode</label>
                <input type="text" id="barcode">
            </div>
            <div id="layeredinput">
                <label for="lab-name">Lab Name</label>
                <input type="text" id="lab-name">
            </div>
            <div>
                <label for="status">Status</label>
                <select id="status">
                    <option value="">Select</option>
                    <option value="pending">Pending</option>
                    <option value="completed">Completed</option>
                    <option value="Hold">Hold</option>
                    <option value="clinical">Clinical</option>
                    <option value="partially ready">Partially Ready</option>
                </select>
            </div>
            <div class="buttons">
                <button id="search-btn" class="search-btn"><i class="fa-solid fa-magnifying-glass"></i> Search</button>
                <button id="clearfield" class="clear-btn"><i class="fa-solid fa-rotate"></i> Clear</button>
            </div>
        </div>
        <div class="totalbarbook">
            <span id="totalbarcodes"></span>
            <span id="totalbookings"></span>
        </div>
        <div class="container-allcases">

            <table id="bookings-table">
                <thead>
                    <tr>
                        <th>Booking No.</th>
                        <th>Date</th>
                        <th>Patient</th>
                        <th id="tablecolfour">Franchisee</th>
                        <th id="tablecolfive">Received barcodes</th>
                        <th>Status</th>
                        <th>Attachments</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="tbody"></tbody>
            </table>
            <div class="preNext">
                <button id="previous">pre</button>
                <span id="pagecounter">
                    <div>1</div>
                </span>
                <button id="next">Next</button>
            </div>
            <!-- Popup Structure -->
            <div id="messagePopup">
                <div>
                    <h3>Messages</h3>
                    <div id="messages">
                        <!-- <div class="senderdivs"><p class="sendertext">this is my order</p></div>
                    <div class="receiverdivs"><p class="receivertext">this is my order</p></div> -->
                    </div>
                </div>
                <textarea id="messageInput" placeholder="Type your message here..."></textarea>
                <button id="sendMessage">Send</button>
                <button id="closePopup">Close</button>
            </div>

            <!-- Overlay to darken background -->
            <div id="popupOverlay"></div>

            <!-- Attachment Management Modal -->
            <div id="attachmentModal">
                <h3 style="margin-top:0;">Manage Attachments</h3>
                <p id="modalCaseId" style="font-size: 13px; color: #888; margin-bottom: 15px;">Case: <span id="targetBookingId"></span></p>
                
                <div class="attach-list" id="attachmentListContainer">
                    <!-- JavaScript will inject list here -->
                </div>

                <div style="margin-top: 20px;">
                    <label style="font-size: 14px; font-weight: 600; display: block; margin-bottom: 8px;">Upload Files (Images/PDFs)</label>
                    <input type="file" id="attachmentFileInput" multiple accept=".jpg,.jpeg,.png,.webp,.gif,.bmp,.tif,.tiff,.avif,.heic,.heif,.pdf,image/*,application/pdf" style="font-size: 13px; width: 100%;">
                    <div class="attachment-hint">Supported on phone and laptop: JPG, PNG, WEBP, HEIC/HEIF and PDF.</div>
                </div>

                <div style="display: flex; justify-content: flex-end; gap: 10px; margin-top: 25px;">
                    <button id="cancelAttachModal" class="clear-btn" style="padding: 8px 20px;">Cancel</button>
                    <button id="saveAttachmentsBtn" class="search-btn" style="padding: 8px 20px;">Upload & Save</button>
                </div>
            </div>
        </div>
        <script src="allcases.js"></script>
    </body>
</html>
