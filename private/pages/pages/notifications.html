<style>
    .notifications-page {
        --np-bg: linear-gradient(180deg, #f8fbff 0%, #edf4fb 100%);
        --np-surface: #ffffff;
        --np-border: #d7e5f2;
        --np-text: #17324d;
        --np-muted: #60758b;
        --np-primary: #0f6cbd;
        background: var(--np-bg);
        border-radius: 26px;
        padding: 28px;
        color: var(--np-text);
        box-shadow: 0 20px 45px rgba(19, 52, 82, 0.08);
        margin: 18px auto;
    }

    .notifications-page * {
        box-sizing: border-box;
    }

    .np-header {
        display: flex;
        justify-content: space-between;
        gap: 18px;
        align-items: flex-start;
        margin-bottom: 20px;
    }

    .np-header h1 {
        margin: 0;
        font-size: 30px;
        font-weight: 800;
        letter-spacing: -0.03em;
    }

    .np-header p {
        margin: 8px 0 0;
        color: var(--np-muted);
        font-size: 14px;
    }

    .np-button {
        border: none;
        border-radius: 14px;
        padding: 11px 16px;
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
    }

    .np-button-primary {
        background: linear-gradient(135deg, #0f6cbd 0%, #1e88e5 100%);
        color: #fff;
    }

    .np-button-secondary {
        background: #e9f2fb;
        color: var(--np-text);
    }

    .np-summary {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 14px;
        margin-bottom: 20px;
    }

    .np-card {
        background: var(--np-surface);
        border: 1px solid var(--np-border);
        border-radius: 20px;
        padding: 18px;
    }

    .np-card-label {
        color: var(--np-muted);
        font-size: 12px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.08em;
    }

    .np-card-value {
        margin-top: 10px;
        font-size: 30px;
        font-weight: 800;
    }

    .np-filter-row {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-bottom: 18px;
    }

    .np-filter-chip {
        border: 1px solid #cad9e8;
        background: #fff;
        color: var(--np-text);
        border-radius: 999px;
        padding: 9px 14px;
        font-size: 13px;
        font-weight: 700;
        cursor: pointer;
    }

    .np-filter-chip.active {
        background: #dcecff;
        border-color: #8fbbe5;
        color: #0f4d84;
    }

    .np-list {
        display: grid;
        gap: 14px;
    }

    .np-item {
        background: var(--np-surface);
        border: 1px solid var(--np-border);
        border-radius: 20px;
        padding: 18px;
        box-shadow: 0 10px 24px rgba(15, 50, 80, 0.05);
    }

    .np-item.unread {
        border-color: #8bb6e1;
        box-shadow: 0 12px 28px rgba(15, 108, 189, 0.10);
    }

    .np-item-top {
        display: flex;
        justify-content: space-between;
        gap: 14px;
        align-items: flex-start;
        margin-bottom: 12px;
    }

    .np-item-title {
        font-size: 17px;
        font-weight: 800;
        margin: 0;
    }

    .np-item-meta {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 8px;
    }

    .np-pill {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 7px 11px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 800;
    }

    .np-pill-read {
        background: #e2e8f0;
        color: #334155;
    }

    .np-pill-unread {
        background: #dbeafe;
        color: #1d4ed8;
    }

    .np-item-message {
        margin: 0;
        font-size: 14px;
        line-height: 1.6;
        color: #26445f;
    }

    .np-item-footer {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 14px;
        margin-top: 14px;
        flex-wrap: wrap;
    }

    .np-item-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 10px;
        margin-top: 14px;
    }

    .np-item-stat {
        background: #f4f8fc;
        border-radius: 14px;
        padding: 12px;
    }

    .np-item-stat-label {
        color: var(--np-muted);
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.08em;
    }

    .np-item-stat-value {
        margin-top: 6px;
        font-size: 14px;
        font-weight: 700;
    }

    .np-empty {
        text-align: center;
        background: var(--np-surface);
        border: 1px dashed #bfd3e6;
        border-radius: 20px;
        padding: 48px 18px;
        color: var(--np-muted);
    }

    @media (max-width: 900px) {
        .np-summary,
        .np-item-grid {
            grid-template-columns: 1fr;
        }
    }

    @media (max-width: 720px) {
        .notifications-page {
            padding: 18px;
            border-radius: 18px;
        }

        .np-header,
        .np-item-top {
            flex-direction: column;
        }
    }
</style>

<section class="notifications-page">
    <div class="np-header">
        <div>
            <h1>Notifications</h1>
            <p>Review recent booking conversations with clear read and unread status.</p>
        </div>
        <div style="display:flex; gap:10px; flex-wrap:wrap;">
            <button class="np-button np-button-secondary" id="npRefreshBtn">Refresh</button>
            <button class="np-button np-button-primary" id="npMarkVisibleBtn">Mark Visible as Read</button>
        </div>
    </div>

    <div class="np-summary">
        <div class="np-card">
            <div class="np-card-label">Total Notifications</div>
            <div class="np-card-value" id="npTotalCount">0</div>
        </div>
        <div class="np-card">
            <div class="np-card-label">Unread</div>
            <div class="np-card-value" id="npUnreadCount">0</div>
        </div>
        <div class="np-card">
            <div class="np-card-label">Read</div>
            <div class="np-card-value" id="npReadCount">0</div>
        </div>
    </div>

    <div class="np-filter-row">
        <button class="np-filter-chip active" data-filter="all">All</button>
        <button class="np-filter-chip" data-filter="unread">Unread</button>
        <button class="np-filter-chip" data-filter="read">Read</button>
    </div>

    <div class="np-list" id="npList">
        <div class="np-empty">Loading notifications...</div>
    </div>
</section>
