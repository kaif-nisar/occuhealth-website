<html>

</html>

<head>
    <title>Update Profile</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <style>
        .container {
            width: 80%;
            margin: 20px auto;
            background-color: #ffffff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        .header {
            background-color: #e0f7fa;
            padding: 10px 20px;
            border-radius: 8px 8px 0 0;
        }

        .header h1 {
            margin: 0;
            font-size: 24px;
        }

        .breadcrumb {
            margin: 10px 0;
            font-size: 14px;
            color: #666;
        }

        .breadcrumb a {
            color: #666;
            text-decoration: none;
        }

        .breadcrumb a:hover {
            text-decoration: underline;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .form-group input[type="text"],
        .form-group input[type="email"] {
            width: calc(100% - 40px);
            padding: 10px;
            margin-left: 40px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        .form-group i {
            position: absolute;
            margin-left: 10px;
            margin-top: 12px;
            color: #666;
        }

        .form-group .required {
            color: red;
        }

        .form-group .optional {
            color: #666;
        }

        .form-group .input-icon {
            position: relative;
        }

        .form-group .input-icon input {
            padding-left: 30px;
        }

        .form-group .input-icon i {
            position: absolute;
            top: 10px;
            left: 10px;
        }

        .form-group .half-width {
            width: 48%;
            display: inline-block;
        }

        .form-group .half-width:first-child {
            margin-right: 4%;
        }

        .btn-update {
            background-color: #f44336;
            color: #fff;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        .btn-update i {
            margin-right: 5px;
        }

        .form-group .input-icon input[type="file"] {
            padding: 6px 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            width: calc(100% - 40px);
            margin-left: 40px;
            font-size: 14px;
            cursor: pointer;
        }

        .form-group .input-icon i {
            color: #666;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <h1>Update Profile</h1>
        </div>
        <div class="breadcrumb">
            <a href="#"><i class="fas fa-home"></i> Dashboard</a> &gt; Update Profile
        </div>
        <h2>Update Profile</h2>
        <div class="form-group">
            <label>Current User</label>
            <input type="text" id="currentUser" readonly>
        </div>
        <div class="form-group">
            <label>Referral Code</label>
            <div class="input-icon">
                <i class="fas fa-tag"></i>
                <input type="text" id="referralCode" readonly>
            </div>
        </div>
        <div class="form-group">
            <label>Enter Valid Lab/Clinic Name <span class="required">**</span> <span class="optional">to be added in
                    Certificate</span></label>
            <div class="input-icon">
                <i class="fas fa-clinic-medical"></i>
                <input type="text" id="clinicName">
            </div>
        </div>
        <div class="form-group">
            <label>Enter Valid Address <span class="required">**</span> <span class="optional">to be added in
                    Certificate</span></label>
            <div class="input-icon">
                <i class="fas fa-map-marker-alt"></i>
                <input type="text" id="address">
            </div>
        </div>
        <div class="form-group">
            <div class="half-width">
                <label>Firstname</label>
                <div class="input-icon">
                    <i class="fas fa-user"></i>
                    <input type="text" id="firstName">
                </div>
            </div>
            <div class="half-width">
                <label>Lastname</label>
                <div class="input-icon">
                    <i class="fas fa-lock"></i>
                    <input type="text" id="lastName">
                </div>
            </div>
        </div>
        <div class="form-group">
            <label>Phone (Optional)</label>
            <div class="input-icon">
                <i class="fas fa-phone"></i>
                <input type="text" id="phoneNo">
            </div>
        </div>
        <div class="form-group">
            <label>Email (Optional)</label>
            <div class="input-icon">
                <i class="fas fa-envelope"></i>
                <input type="email" id="email">
            </div>
        </div>
        <div class="form-group">
            <label>Upload Logo <span class="optional">(PNG, JPG)</span></label>
            <div class="input-icon">
                <i class="fas fa-image"></i>
                <input type="file" id="weblogo" accept="image/*">
            </div>
            <div id="weblogoPreviewContainer" style="display: none; margin-top: 8px; margin-left: 40px;">
                <img id="weblogoPreview" src="" alt="Lab Logo" style="max-height: 50px; max-width: 140px; object-fit: contain; border: 1px solid #cbd5e1; padding: 4px; border-radius: 4px; background: #fafafa;">
            </div>
        </div>
        <div class="form-group">
            <label>Upload Profile Image <span class="optional">(PNG, JPG)</span></label>
            <div class="input-icon">
                <i class="fas fa-user-circle"></i>
                <input type="file" id="profileImage" accept="image/*">
            </div>
            <div id="profileImagePreviewContainer" style="display: none; margin-top: 8px; margin-left: 40px;">
                <img id="profileImagePreview" src="" alt="Profile Image" style="max-height: 50px; max-width: 140px; object-fit: contain; border: 1px solid #cbd5e1; padding: 4px; border-radius: 4px; background: #fafafa;">
            </div>
        </div>
        <div class="form-group">
            <label>Upload NABL Logo <span class="optional">(PNG, JPG)</span> &mdash; <span style="font-weight: 600; color: #0284c7; font-size: 13px;"><i class="fas fa-stamp"></i> Appears on top-right of all PDF reports</span></label>
            <div class="input-icon">
                <i class="fas fa-certificate"></i>
                <input type="file" id="nablLogo" accept="image/*">
            </div>
            <div id="nablLogoPreviewContainer" style="display: none; margin-top: 10px; margin-left: 40px;">
                <span style="font-size: 12px; color: #475569; display: block; margin-bottom: 5px; font-weight: 500;">Current / Selected NABL Logo (PDF Report Top-Right):</span>
                <div style="display: inline-flex; align-items: center; gap: 12px; background: #f0fdf4; border: 1.5px solid #86efac; padding: 6px 14px; border-radius: 6px;">
                    <img id="nablLogoPreview" src="" alt="NABL Logo Preview" style="max-height: 55px; max-width: 130px; object-fit: contain; display: block;">
                    <button type="button" id="removeNablLogoBtn" style="background: #fee2e2; border: 1px solid #fca5a5; color: #b91c1c; border-radius: 4px; padding: 4px 8px; font-size: 11px; cursor: pointer; font-weight: 500;" title="Remove NABL logo from reports"><i class="fas fa-trash-alt"></i> Remove</button>
                </div>
            </div>
        </div>

        <button class="btn-update" id="updateButton"><i class="fas fa-save"></i> Update</button>
    </div>
</body>

</html>
