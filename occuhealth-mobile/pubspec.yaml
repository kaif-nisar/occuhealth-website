name: occuhealth_mobile
description: "OccuHealth Mobile - Modern Diagnostics Lab & Franchise Management Application"
publish_to: "none"
version: 2.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # UI & Design System
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1

  # Networking & HTTP
  http: ^1.2.2
  http_parser: ^4.0.2

  # State Management
  provider: ^6.1.2

  # Local Persistence
  shared_preferences: ^2.3.2

  # Formatting & Utilities
  intl: ^0.19.0
  file_picker: ^8.1.2
  path_provider: ^2.1.4
  open_filex: ^4.5.0
  share_plus: ^10.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/

